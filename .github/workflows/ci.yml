name: CI

on:
  push:
    branches: [main, id_based_wiring]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "jax[cpu]"
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check learn_lpns tests

      - name: Lint
        run: ruff check learn_lpns tests

      - name: Run unit tests
        run: pytest -m "not integration" -v --cov=learn_lpns --cov-report=term-missing --cov-fail-under=15
