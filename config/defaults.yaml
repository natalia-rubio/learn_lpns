# Pipeline hyperparameters. Override via LEARN_LPNS_CONFIG or config/sets/<set_name>.yaml.

physics:
  rho: 1.06   # blood density (g/cm^3)
  mu: 0.04    # blood viscosity (Poise)

solver:
  absolute_tolerance: 1.0e-5
  maximum_nonlinear_iterations: 50
  number_of_cardiac_cycles: 1
  steady_initial: false

calibration:
  tolerance_gradient: 1.0e-4
  tolerance_increment: 1.0e-4
  maximum_iterations: 20
  default_l2_r: 1.0e5
  default_l2_stenosis: 1.0e10
  set_l2_penalties:
    VMR_abdo:
      l2_r: 1.0e2
      l2_stenosis: 1.0e5
    VMR_rigid_aorta_adults:
      l2_r: 1.0e5
      l2_stenosis: 1.0e10

split:
  percent_train: 0.9                    # learn-lpns-cv default
  data_processing_percent_train: 0.8    # learn-lpns-data-processing default
  cv_num_trials: 5
  seed: 0
  cv_trial_seed_stride: 1000

training:
  num_epochs: 500
  early_stop_loss_threshold: 1.0e-7
  batch_size_divisor: 10
  generation_weighted_loss_scale: 1.0
  optimizer:
    init: 0.02
    transition_steps: 1000
    decay_rate: 0.95
  vessel:
    num_layers: 2
    layer_width: 10
  rri_coefficients:
    - name: R
      label: "Linear Resistor (R)"
      target_output_column: 0
      lr_init: 0.01
      junction_num_layers: 2
      junction_layer_width: 10
      junction_asymmetric_overestimate_weight: 2000
      vessel_asymmetric_overestimate_weight: 10
    - name: S
      label: "Stenosis Resistor (S)"
      target_output_column: 1
      lr_init: 0.001
      junction_num_layers: 2
      junction_layer_width: 10
      junction_asymmetric_overestimate_weight: 100
      vessel_asymmetric_overestimate_weight: 10
    - name: L
      label: "Inductor (L)"
      target_output_column: 2
      lr_init: 0.01
      junction_num_layers: 4
      junction_layer_width: 20
      junction_asymmetric_overestimate_weight: 10000
      vessel_asymmetric_overestimate_weight: 1000
