# Pipeline hyperparameters. Override via LEARN_LPNS_CONFIG or config/sets/<set_name>.yaml.

physics:
  rho: 1.06   # blood density (g/cm^3); used for Poiseuille R and L from geometry
  mu: 0.04    # blood dynamic viscosity (Poise); used for Poiseuille R and L from geometry
  reference_reynolds: 5000   # Re_c for R/S/L non-dimensionalization (arXiv:2508.21165 Eq. 9)

# svzerodsolver simulation parameters
solver:
  absolute_tolerance: 1.0e-5              # svzerodsolver nonlinear residual tolerance (simulation_parameters)
  maximum_nonlinear_iterations: 50        # cap on Newton iterations per time step
  number_of_cardiac_cycles: 1             # cardiac cycles to simulate (includes warm-up when steady_initial is false)
  steady_initial: false                   # if true, run a steady solve before the unsteady cardiac cycle

# svzerodcalibrator calibration parameters
calibration:
  tolerance_gradient: 1.0e-4              # svzerodcalibrator stop when parameter gradient norm falls below this
  tolerance_increment: 1.0e-4               # svzerodcalibrator stop when parameter update norm falls below this
  maximum_iterations: 20                  # max Levenberg–Marquardt iterations per calibration
  default_l2_r: 1.0e5                     # L2 penalty on Poiseuille R when --run_config includes penalty_on + quadratic_resistor
  default_l2_stenosis: 1.0e10             # L2 penalty on stenosis coefficient S under the same run_config flags
  decoupled_l2_r: 0                 # decoupled_ls Tikhonov: lambda * R^2 toward 0
  decoupled_l2_stenosis: 0        # decoupled_ls Tikhonov: lambda * S^2 toward 0
  decoupled_l2_l: 0                # decoupled_ls Tikhonov: lambda * L^2 toward 0
  decoupled_nonneg_r: false          # decoupled_ls: bound R >= 0 only when quadratic_resistor (S) is calibrated
  decoupled_nonneg_l: true              # decoupled_ls: bound L >= 0 in each element fit
  plot_rsl_fits: false                    # decoupled_ls: save dP vs Q diagnostic plots under results/RSL_fits/

cohorts:
  default_cv_set_names:                   # default batch for learn-lpns-cv-all-sets and cross-set plots
    - VMR_aorta
    - VMR_abdo
    - VMR_pulmo
    - VMR_all
  sets:                                   # per-cohort metadata; optional overrides (e.g. calibration) may be added here
    VMR_aorta:
      display_label: Aortic
    VMR_abdo:
      display_label: Aortofemoral
    VMR_pulmo:
      display_label: Pulmonary
    VMR_all:
      display_label: All

data_processing:
  flow_split_method: mean_over_time         # mean_over_time | peak_inlet_flow (flow_split from geometric 0D CSV)
  stenosis_generation_limit:
    enabled: true                  # RSL/S training/inference only below junction/vessel generation limits
    junction_max_generation: 1           # inclusive; junction inlet-vessel generation
    vessel_max_generation: 0      
    # VMR_aorta:
    #   junction_max_generation: 0   # stricter junction S limit for aortic cohort only
    # VMR_all:
    #   junction_max_generation: 0   # stricter junction S limit for aortic cohort only
split:
  percent_train: 0.9                      # default train fraction for learn-lpns-cv geometry splits
  data_processing_percent_train: 0.8      # default train fraction for learn-lpns-data-processing / notebook demo
  cv_num_trials: 5                        # default k in k-fold cross-validation (learn-lpns-cv)
  seed: 0                                 # default RNG seed for standalone split-index generation
  cv_trial_seed_stride: 1000              # CV trial seed = trial_index * stride + resample_attempt
  cv_max_parallel_trials: 3               # parallel CV trial workers (1 = serial)
  cv_worker_cpu_threads: 4             # optional OMP/XLA thread cap per worker when parallel > 1

# Base training = gen_loss recovered settings (VMR_pulmo ~7% NN+vessel pressure MPE).
# Per-run-config overlays live in training_run_configs (loader-only; deep-merged last onto training).
training:
  num_epochs: 2000                         # default max epochs when a coefficient omits num_epochs / vessel_num_epochs
  restore_best_weights: false             # save weights from epoch with lowest weighted train training loss
  early_stop_loss_threshold: 1.0e-7       # stop when weighted train training loss (MSE) drops below this; retune after policy change
  quiet_epochs: true                   # suppress per-epoch train/val loss lines during training (also --quiet_epochs on learn-lpns-train)
  batch_size_divisor: 10                  # batch_size = ceil(n_train / batch_size_divisor)
  generation_weighted_loss_decay_base: 2.0   # default gen_loss weight = 1/base^generation; override per R/S/L below
  multi_output_rri: false                 # if true, train one 3-output network (R,S,L) instead of three separate nets
  activation: relu #leaky_relu                         # default hidden-layer activation (relu | leaky_relu | tanh)
  clip_predictions: false         # if true, clip R/S/L predictions to train-set min/max at inference
  nondimensionalize_rsl: false   # if true, train on R*/S*/L* and map back to physical R/S/L at inference
  include_speed_change: false     # junction feature; off for gen_loss gold; QR overlay may enable
  optimizer:
    init: 0.02                            # default Adam learning rate (overridden per coefficient by lr_init)
    transition_steps: 1000                # Optax exponential decay: steps between LR multiplications
    decay_rate: 0.8                       # gen_loss gold LR anneal
  vessel:
    num_layers: 2                         # match orig gold (was 1)
    layer_width: 10                         # neurons per hidden layer in vessel MLPs
  rri_coefficients:                       # one single-output junction network per coefficient (R, S, L)
    - name: R
      label: "Linear Resistor (R)"
      target_output_column: 0             # column in output_rri / junction_lumped_parameters CSV
      lr_init: 0.01                       # Adam initial learning rate for the R network
      num_epochs: 4000                    # junction; omit to use training.num_epochs
      vessel_num_epochs: 2000             # vessel; omit to use num_epochs then training.num_epochs
      junction_num_layers: 2              # hidden layers in the junction R MLP
      junction_layer_width: 10          # neurons per hidden layer in the junction R MLP
      junction_asymmetric_overestimate_weight: 2000   # extra loss weight when predicted R > target (asymmetric_loss)
      vessel_asymmetric_overestimate_weight: 10    
      # VMR_aorta:
      #   vessel_num_layers: 1   # same for vessel R network
    - name: S
      label: "Stenosis Resistor (S)"
      target_output_column: 1
      lr_init: 0.1               # S-only override; R/L use training.activation
      num_epochs: 2000
      vessel_num_epochs: 2000
      junction_num_layers: 1
      junction_layer_width: 10
      #generation_weighted_loss_decay_base: 3.0
      junction_asymmetric_overestimate_weight: 2000
      vessel_asymmetric_overestimate_weight: 10
      VMR_all:
        junction_layer_width: 10
      # VMR_aorta:
      #   junction_layer_width: 10
    - name: L
      label: "Inductor (L)"
      target_output_column: 2
      lr_init: 0.01
      num_epochs: 2000
      vessel_num_epochs: 2000
      junction_num_layers: 4             # deeper/wider net for inductance (typically harder to fit)
      junction_layer_width: 20            # match orig gold (was 10)
      junction_asymmetric_overestimate_weight: 10000
      vessel_asymmetric_overestimate_weight: 1000
      # VMR_aorta:
      #   vessel_num_layers: 1
      #   junction_num_layers: 4
      #   junction_layer_width: 10

# Loader-only: deep-merged onto training after set overrides (keys = canonical --run_config suffixes).
training_run_configs:
  gen_loss: {}                            # explicit no-op; base training already matches gen_loss gold
  quadratic_resistor_gen_loss:
    include_speed_change: true            # QR used speed_change before gen_loss recovery
    early_stop_loss_threshold: 1.0e-7     # re-enable early stop for joint R/S training
    optimizer:
      decay_rate: 0.99                    # slower anneal; helps keep QR R from exploding
    vessel:
      num_layers: 1                       # pre-recovery vessel depth for QR
    rri_coefficients:
      - name: L
        junction_layer_width: 10          # pre-recovery L width for QR
