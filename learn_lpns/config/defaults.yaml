# Bundled fallback — keep in sync with config/defaults.yaml at the repo root.

physics:
  rho: 1.06   # blood density (g/cm^3); used for Poiseuille R and L from geometry
  mu: 0.04    # blood dynamic viscosity (Poise); used for Poiseuille R and L from geometry

solver:
  absolute_tolerance: 1.0e-5              # svzerodsolver nonlinear residual tolerance (simulation_parameters)
  maximum_nonlinear_iterations: 50        # cap on Newton iterations per time step
  number_of_cardiac_cycles: 1             # cardiac cycles to simulate (includes warm-up when steady_initial is false)
  steady_initial: false                   # if true, run a steady solve before the unsteady cardiac cycle

calibration:
  tolerance_gradient: 1.0e-4              # svzerodcalibrator stop when parameter gradient norm falls below this
  tolerance_increment: 1.0e-4               # svzerodcalibrator stop when parameter update norm falls below this
  maximum_iterations: 20                  # max Levenberg–Marquardt iterations per calibration
  default_l2_r: 1.0e5                     # L2 penalty on Poiseuille R when --run_config includes penalty_on + quadratic_resistor
  default_l2_stenosis: 1.0e10             # L2 penalty on stenosis coefficient S under the same run_config flags
  decoupled_l2_r: 1.0e-3                  # decoupled_ls Tikhonov: lambda * R^2 toward 0
  decoupled_l2_stenosis: 1.0e-2           # decoupled_ls Tikhonov: lambda * S^2 toward 0
  decoupled_l2_l: 1.0e-3                  # decoupled_ls Tikhonov: lambda * L^2 toward 0
  plot_rsl_fits: false                    # decoupled_ls: save dP vs Q diagnostic plots under results/RSL_fits/

cohorts:
  default_cv_set_names:                   # default batch for learn-lpns-cv-all-sets and cross-set plots
    - VMR_rigid_aorta_adults_all
    - VMR_abdo
    - VMR_pulmo_healthy
    - VMR_all
  sets:                                   # per-cohort metadata; optional overrides (e.g. calibration) may be added here
    VMR_rigid_aorta_adults_all:
      display_label: Aortic
    VMR_abdo:
      display_label: Aortofemoral
    VMR_pulmo_healthy:
      display_label: Pulmonary
    VMR_all:
      display_label: All

data_processing:
  flow_split_method: peak_inlet_flow         # mean_over_time | peak_inlet_flow (flow_split from geometric 0D CSV)

split:
  percent_train: 0.9                      # default train fraction for learn-lpns-cv geometry splits
  data_processing_percent_train: 0.8      # default train fraction for learn-lpns-data-processing / notebook demo
  cv_num_trials: 5                        # default k in k-fold cross-validation (learn-lpns-cv)
  seed: 0                                 # default RNG seed for standalone split-index generation
  cv_trial_seed_stride: 1000              # CV trial seed = trial_index * stride + resample_attempt

training:
  num_epochs: 10    00                         # max Optax training epochs per R/S/L network
  early_stop_loss_threshold: 1.0e-7       # stop training when train loss drops below this
  batch_size_divisor: 10                  # batch_size = ceil(n_train / batch_size_divisor)
  generation_weighted_loss_decay_base: 2.0   # gen_loss sample weight = 1 / base^generation (base>1 down-weights distal outlets)
  multi_output_rri: false                 # if true, train one 3-output network (R,S,L) instead of three separate nets
  leaky_relu: true                      # if true, use Leaky ReLU (slope 0.01) instead of ReLU in MLP hidden layers
  clip_predictions: true               # if true, clip R/S/L predictions to train-set min/max at inference
  optimizer:
    init: 0.02                            # default Adam learning rate (overridden per coefficient by lr_init)
    transition_steps: 1000                # Optax exponential decay: steps between LR multiplications
    decay_rate: 0.95                      # multiply learning rate by this factor every transition_steps
  vessel:
    num_layers: 2                         # hidden layers in each vessel R/S/L MLP
    layer_width: 10                         # neurons per hidden layer in vessel MLPs
  rri_coefficients:                       # one single-output junction network per coefficient (R, S, L)
    - name: R
      label: "Linear Resistor (R)"
      target_output_column: 0             # column in output_rri / junction_lumped_parameters CSV
      lr_init: 0.01                       # Adam initial learning rate for the R network
      junction_num_layers: 2              # hidden layers in the junction R MLP
      junction_layer_width: 10            # neurons per hidden layer in the junction R MLP
      junction_asymmetric_overestimate_weight: 2000   # extra loss weight when predicted R > target (asymmetric_loss)
      vessel_asymmetric_overestimate_weight: 10       # same for vessel R network
    - name: S
      label: "Stenosis Resistor (S)"
      target_output_column: 1
      lr_init: 0.001
      junction_num_layers: 2
      junction_layer_width: 10
      junction_asymmetric_overestimate_weight: 100
      vessel_asymmetric_overestimate_weight: 10
    - name: L
      label: "Inductor (L)"
      target_output_column: 2
      lr_init: 0.01
      junction_num_layers: 4              # deeper/wider net for inductance (typically harder to fit)
      junction_layer_width: 20
      junction_asymmetric_overestimate_weight: 10000
      vessel_asymmetric_overestimate_weight: 1000
