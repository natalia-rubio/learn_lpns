[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-lpns"
version = "0.1.0"
description = "Train and deploy neural networks for cardiovascular lumped-parameter models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
    "vtk>=9.2,<10",
    "optax>=0.2,<1",
    "dill>=0.3.8,<1",
    "seaborn>=0.13,<1",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.4",
]

[project.scripts]
learn-lpns-cv = "learn_lpns.zerod_calibration.run_cross_validation:main"
learn-lpns-batch-zerod = "learn_lpns.zerod_calibration.batch_generate_zerod_inputs_vmr:main"
learn-lpns-data-processing = "learn_lpns.data_processing.run_data_processing:main"
learn-lpns-train = "learn_lpns.neural_network.launch_training:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["learn_lpns*"]

[tool.setuptools.package-data]
"learn_lpns.config" = ["defaults.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires svZeroDPlus binaries and/or heavy data",
]

[tool.coverage.run]
source = ["learn_lpns"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    # Plot labels and docs use typographic minus (U+2212), en-dash, etc.
    "RUF001",
    "RUF002",
    "RUF003",
]
