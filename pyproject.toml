[project]
name = "learn-lpns"
version = "0.1.0"
description = "Train and deploy neural networks for cardiovascular lumped-parameter models"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
