[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-lpns"
version = "0.1.0"
description = "Train and deploy neural networks for cardiovascular lumped-parameter models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
    "vtk>=9.2,<10",
    "optax>=0.2,<1",
    "dill>=0.3.8,<1",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
learn-lpns-cv = "learn_lpns.zerod_calibration.run_cross_validation:main"
learn-lpns-batch-zerod = "learn_lpns.zerod_calibration.batch_generate_zerod_inputs_vmr:main"
learn-lpns-data-processing = "learn_lpns.data_processing.run_data_processing:main"
learn-lpns-train = "learn_lpns.neural_network.launch_training:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["learn_lpns*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Script entry points insert REPO_ROOT on sys.path before learn_lpns imports.
"learn_lpns/**/run_cross_validation.py" = ["E402"]
"learn_lpns/**/generate_zerod_inputs.py" = ["E402"]
"learn_lpns/**/batch_generate_zerod_inputs_vmr.py" = ["E402"]
"learn_lpns/**/launch_training.py" = ["E402"]
"learn_lpns/**/run_data_processing.py" = ["E402"]
"learn_lpns/**/generate_split_indices.py" = ["E402"]
"learn_lpns/**/regenerate_feature_histograms.py" = ["E402"]
"learn_lpns/**/report_jax_test_split_counts.py" = ["E402"]
"learn_lpns/**/plot_zero_d_params.py" = ["E402"]
# Legacy cluster scripts: semicolons and long HPC paths.
"learn_lpns/cluster_scripts/**" = ["E501", "E701", "E702"]
